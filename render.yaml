services:
  - type: web
    name: sonory-lab-web
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: SUNO_PROFILE_HANDLE
        value: sonorylab
      - key: CACHE_TTL_SECONDS
        value: "300"
      - key: ADMIN_PASSWORD
        sync: false
